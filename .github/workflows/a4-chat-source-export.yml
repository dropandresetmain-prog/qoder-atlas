name: Isolated A4 source export
on:
  push:
    branches: [work/a4-continuation-source-export]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 987a6b66cc34b8d7fc327dbda76853e8ef1e761b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Export locked dependencies and runtime without credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 987a6b66cc34b8d7fc327dbda76853e8ef1e761b
          cp "$(command -v node)" a4-node
          tar -czf a4-dependencies.tar.gz node_modules a4-node
      - uses: actions/upload-artifact@v4
        with:
          name: a4-dependencies-987a6b6
          path: a4-dependencies.tar.gz
          retention-days: 1
